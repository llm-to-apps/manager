version: "3.9"

services:
  manager:
    image: llagents/manager:local
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      PORT: "8080"
      ROOT_DOMAIN: llmagents.com
      USER_INSTANCE_IMAGE: llagents/user-instance:latest
      DB_NETWORK_ID: db
      INGRESS_NETWORK_ID: ingress
    networks:
      - internal
      - db
    deploy:
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any

networks:
  internal:
    driver: overlay
    attachable: true
  db:
    driver: overlay
    attachable: true
  ingress:
    driver: overlay
    attachable: true
